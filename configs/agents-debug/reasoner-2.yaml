# DEBUG vendor binding for reasoner-2 (evidence).
#
# Same frozen experiment, cheap model. Debugging the plumbing - handoffs,
# envelope stamping, schema validation, budget detection - exercises the
# same code paths regardless of which model answers, so paying Opus rates
# to find a mount bug is waste.
#
# Pair with the SAME protocol as a real run, so protocol_version and
# protocol_hash are identical and only the agent-set hash differs:
#
#   bench -protocol configs/protocols/pilot-v1.yaml -agents configs/agents-debug ...
#
# NOT FOR RESULTS. A cohort run under this binding is a system test, not a
# benchmark measurement: haiku's findings are not comparable with opus's,
# and mixing them within a cohort would violate design principle 6.
adapter: claude
model: claude-haiku-4-5-20251001

# low, not high: debugging cares whether a stage completes and validates,
# not how well it reasons. Valid levels are low/medium/high/xhigh/max,
# verified against `claude --help` - note "standard" is NOT one of them.
reasoning_level: low

budget:
  # MEASUREMENT VALUES, not real bounds. The first live run showed the
  # original guesses were calibrated against the wrong quantities:
  #
  #   output_tokens covers everything generated across the whole session -
  #   every tool-using turn and its thinking - not the final review. A 1.5KB
  #   review legitimately reported 10303 output tokens against an 8000
  #   "limit", failing a stage that had done nothing wrong.
  #
  #   input_tokens now includes cache reads and writes (claude reports the
  #   uncached remainder separately, and it is tiny - 10 against a 13615
  #   cache read). Cache reads accumulate PER TURN, so a multi-turn stage
  #   can bill far more input than its context ever held.
  #
  # Deliberately set high enough not to trip, so a debug run measures what a
  # stage actually consumes instead of failing on a guess. Calibrate the
  # real cohort from these numbers, not from intuition.
  max_input_tokens: 2000000
  max_output_tokens: 100000
  max_wall_clock_seconds: 600

  # Left declared even though claude's envelope has no tool-call count: the
  # run should WARN that it could not be checked. That warning is the
  # feature, and a debug run is where it should be seen.
  max_tool_calls: 60

  max_cost_usd: 1.00
