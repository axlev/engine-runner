# Pilot v1 - the fixed pilot cohort of docs/system-design.md section 15,
# Milestone 4.
#
# This file is the frozen definition of one EXPERIMENT: the prompts each
# reasoner is given, which handoffs are enabled, the output contracts, and
# the stopping rules. Per design principle 6, none of it is tuned per case.
#
# It deliberately names no vendor. Which adapter and model run each stage,
# at what effort and under what budget, lives in an agent set under
# configs/agents/ (section 4.2). That separation is what lets this exact
# cohort be smoke-tested through the fixture adapter and then run for real
# through a vendor, without either producing a different protocol_version:
#
#   # smoke test, no credentials or cost
#   bench -protocol configs/protocols/pilot-v1.yaml -agents fixtures/agents/fixture.yaml ...
#
#   # the real cohort
#   bench -protocol configs/protocols/pilot-v1.yaml -agents configs/agents/opus.yaml ...
#
# All paths are relative to the repository root.

protocol_version: pilot-v1

handoffs:
  # Section 6.4: "Pilot v1 enables this handoff."
  enable_a_to_b: true

retry_policy:
  # One repair attempt on invalid structured output (section 12).
  max_attempts: 2

stages:
  reasoner-1:
    prompt: prompts/pilot-v1/reasoner-1.md
    output_schema: schemas/review-a.schema.json

  reasoner-2:
    prompt: prompts/pilot-v1/reasoner-2.md
    output_schema: schemas/review-b.schema.json

  reasoner-3:
    prompt: prompts/pilot-v1/reasoner-3.md
    output_schema: schemas/review-c.schema.json
