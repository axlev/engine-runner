# Vendor binding for the WIDE opus arm: claude, opus-5, with search.
#
# This is a separate arm, not an edit to opus.yaml. The narrow arm's 9 sealed
# results are fingerprinted against that file's hash, and changing it would
# retroactively make them unreadable. A new capability is a new file.
#
# WHAT DIFFERS FROM opus.yaml - exactly two things, both deliberate:
#
#   1. tools: Read, Grep, Glob   (narrow arm: absent, i.e. Read only)
#   2. raised budgets            (see BUDGETS below)
#
# Everything else - adapter, model, reasoning_level - is identical, so a
# comparison against the narrow arm has two variables rather than one. That
# is a real limitation of this arm and it is stated here rather than
# discovered later: if wide moves more dispositions, this file alone cannot
# say whether search or headroom did it. Attribution has to come from
# reading whether stage 3's rationales actually used search.
#
#   bench -protocol configs/protocols/pilot-v1.yaml -agents configs/agents/opus-wide.yaml ...

adapter: claude
model: claude-opus-5
reasoning_level: high

# THE POINT OF THIS ARM. The narrow arm restricted reviewers to Read, which
# meant they could only open paths already named in the diff or the
# handoffs - they could not enumerate callers of a function, find a type's
# definition, or list a directory (directory reads fail outright).
#
# That was not a theoretical limit. It cost a measured disposition: in
# opus-de6d5d30 f8 stage 3 wrote out the exact test that would settle the
# finding (does `enum zclient_send_status` have a negative enumerator?),
# paged blindly through lib/zclient.h at eight offsets, stopped at line 745,
# and returned INCONCLUSIVE "without locating the definition inside budget".
# The enum is at line 764, and it contains ZCLIENT_SEND_FAILURE = -1, which
# by the stage's own reasoning made the finding a REJECT.
#
# Glob is included alongside Grep because half the gap was enumeration, not
# matching: stage 3 could not list tests/ to find consumers of an API, and
# said so as its reason for leaving a claim un-narrowed.
tools:
  - Read
  - Grep
  - Glob

# BUDGETS - sized for HEADROOM, not for the narrow arm's observed spend.
#
# The narrow arm's per-stage maxima, against its caps:
#
#   reasoner-1   $3.51 / $4.00   88%      737s / 900s   82%
#   reasoner-2   $5.37 / $5.00  107%      860s / 900s   96%   <- killed
#   reasoner-3   $3.21 / $4.00   80%      518s / 900s   58%
#
# reasoner-2 exceeded its cost cap on both attempts of opus-c21d519d and the
# vendor killed the stage, so that case never produced a review-b and the
# narrow arm closed at 9/10. Note it was also at 96% of wall-clock: raising
# only max_cost_usd would have moved the failure rather than removed it, so
# both bounds go up together here.
#
# WHICH WAY DOES SEARCH MOVE COST? Argued both ways, and the answer decided
# these numbers. Search obviously removes waste - eight Read calls paging a
# header is strictly worse than one Grep. But the narrow runs do not read
# like stages that were merely inefficient; they read like stages that hit a
# wall and stopped. de6d5d30 f8 gave up "inside budget", and 322abe6a f4
# left a claim un-narrowed because it could not enumerate a directory. Those
# are abandoned investigations, and search does not make them cheaper - it
# makes them HAPPEN, at a cost the narrow arm never paid.
#
# So the expectation is that spend goes UP on exactly the cases that matter,
# and the caps are set for that rather than for the observed narrow maxima.
# A stage killed at its cap produces no evidence at all, which is the most
# expensive outcome available: opus-c21d519d burned $13.72 and returned
# nothing. Headroom is cheaper than a lost case.
#
# max_tool_calls rises furthest in proportional terms because search changes
# the SHAPE of tool use - many cheap targeted calls instead of a few large
# reads. It is detection-only (checked after a stage is already paid for),
# so a loose value costs nothing and a tight one fails correct work.

stages:
  reasoner-1:
    budget:
      max_input_tokens: 12000000
      max_output_tokens: 100000
      max_wall_clock_seconds: 1500
      max_tool_calls: 100
      max_cost_usd: 6.00

  # The stage that failed, and the most search-intensive of the three: it
  # builds causal chains from the repository rather than adjudicating two
  # handoffs, so it is the one that most wanted a grep it did not have.
  reasoner-2:
    budget:
      max_input_tokens: 12000000
      max_output_tokens: 100000
      max_wall_clock_seconds: 1800
      max_tool_calls: 140
      max_cost_usd: 9.00

  reasoner-3:
    budget:
      max_input_tokens: 12000000
      max_output_tokens: 100000
      max_wall_clock_seconds: 1500
      max_tool_calls: 100
      max_cost_usd: 6.00
