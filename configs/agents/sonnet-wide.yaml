# Vendor binding for the WIDE sonnet arm: claude, sonnet-5, with search.
#
# UNRUN AS OF 2026-09-12. This file exists so the wide pair is complete and
# reviewable, not because a run is scheduled: the decision on whether to
# spend a sonnet arm waits on opus-wide's numbers.
#
# It is the control for the one question opus-wide cannot answer alone.
# opus-wide changes two things at once against opus.yaml (tools AND
# budgets), so a movement increase there has two candidate causes. More
# importantly, the narrow arms left the central comparison unresolved:
# opus moved 7 of 41 findings and sonnet 1 of 19, which is a 3.2x
# direction-consistent gap at Fisher exact p = 0.42 - indistinguishable
# from chance. Re-running both arms wide is the only way to tell whether
# that gap is real or whether both arms were equally blinded by a harness
# that could not search.
#
# Keep this file in lockstep with opus-wide.yaml except for `model`. The
# whole value of an arm pair is that exactly one thing differs between them,
# and a drifted budget here would silently become a second variable.
#
#   bench -protocol configs/protocols/pilot-v1.yaml -agents configs/agents/sonnet-wide.yaml ...

adapter: claude
model: claude-sonnet-5
reasoning_level: high

tools:
  - Read
  - Grep
  - Glob

# BUDGETS are opus-wide's, verbatim and deliberately.
#
# They are far above anything sonnet has ever spent - the entire narrow
# sonnet arm cost $20.64 for ten cases, and its most expensive single stage
# was a fraction of these ceilings. That is intentional. max_cost_usd is a
# runaway stop, not a target, and the comparison this arm exists to serve is
# ruined if the two arms are bounded differently: a sonnet stage that halted
# at a lower ceiling than its opus counterpart would look like a weaker
# model when it was only a smaller allowance.
#
# So these numbers are not a prediction about sonnet's spend. They are the
# same rail, set where it cannot bind either arm, so that anything the
# comparison shows is about the model rather than about the budget. The
# narrow arms already demonstrated the failure this avoids - a stage killed
# at its cap returns no evidence while still being billed.

stages:
  reasoner-1:
    budget:
      max_input_tokens: 12000000
      max_output_tokens: 100000
      max_wall_clock_seconds: 1500
      max_tool_calls: 100
      max_cost_usd: 6.00

  reasoner-2:
    budget:
      max_input_tokens: 12000000
      max_output_tokens: 100000
      max_wall_clock_seconds: 1800
      max_tool_calls: 140
      max_cost_usd: 9.00

  reasoner-3:
    budget:
      max_input_tokens: 12000000
      max_output_tokens: 100000
      max_wall_clock_seconds: 1500
      max_tool_calls: 100
      max_cost_usd: 6.00
