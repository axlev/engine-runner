# Vendor binding for reasoner-2 (evidence).
#
# See reasoner-1.yaml for what belongs here and why. NOT YET RUNNABLE - no
# adapter container image has been built.
adapter: claude
model: claude-opus-5
reasoning_level: high

budget:
  # Building causal chains means reading more of the tree than discovery did,
  # and re-reading it per finding.
  max_input_tokens: 160000
  max_output_tokens: 8000
  max_wall_clock_seconds: 900
  max_tool_calls: 80
  max_cost_usd: 2.50
