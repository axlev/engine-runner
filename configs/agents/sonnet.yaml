# Vendor binding: claude, sonnet-5. The middle arm.
#
# The suggested PRIMARY arm for a first real cohort. The benchmark needs
# room to show the pipeline's value: too weak a model and all three stages
# find nothing, too strong and reasoner-1 finds everything, and neither
# leaves an increment to measure. Sonnet is the reasonable middle guess -
# and it is a guess, not a measurement, until a real cohort runs.
#
# NOT MIXABLE WITHIN A COHORT: a cohort runs entirely on one arm.

adapter: claude
model: claude-sonnet-5
reasoning_level: high

# BUDGETS CALIBRATED against a real FRR case, 2026-09-10 (backlog 0.3).
# case-83d945a6dd4e5785: a +2/-0 diff over a 76 MB, 7,544-file snapshot.
# A completed sonnet run cost $1.99 and took 668s wall clock:
#
#   reasoner-1  2,214,475 in   31,950 out   360s   $1.20
#   reasoner-2    536,087 in   14,395 out   150s   $0.49
#   reasoner-3    167,893 in   14,418 out   158s   $0.30
#
# Discovery dominates everything - 76% of the input and 60% of the cost.
#
# THE DIVISION OF LABOUR MATTERS MORE THAN THE NUMBERS. max_cost_usd is the
# real control: it is the only bound a vendor enforces BEFORE the fact
# (claude's --max-budget-usd), so it stops a runaway rather than reporting
# one. The token bounds are detection-only, checked after a stage has already
# been paid for, so they are set loose enough to catch genuine runaway and
# nothing else. Setting them tight buys no protection and fails correct work:
# the pre-calibration 400,000 came from 7-file fixtures and failed a stage
# that had produced a valid review.
#
# And read max_input_tokens carefully. It sums uncached input, cache writes
# and cache reads, and cache reads are re-billed EVERY TURN of an agentic
# session, so it tracks TURN COUNT far more than context size. The 2.2M above
# cost $1.20; the same volume of fresh input would cost roughly $6.60.
# Two runs of this one case used 1.2M and 2.2M - the variance is why the
# bound is set at several times the observed maximum rather than just above
# it.

stages:
  reasoner-1:
    budget:
      max_input_tokens: 8000000
      max_output_tokens: 100000
      max_wall_clock_seconds: 600
      # Declared even though claude's envelope carries no tool-call count,
      # so a run warns that the bound went unenforced. That warning is the
      # feature: a limit silently skipped is worse than one openly unmet.
      max_tool_calls: 60
      max_cost_usd: 2.50
  reasoner-2:
    budget:
      max_input_tokens: 8000000
      max_output_tokens: 100000
      max_wall_clock_seconds: 600
      max_tool_calls: 80
      max_cost_usd: 2.50
  reasoner-3:
    budget:
      max_input_tokens: 8000000
      max_output_tokens: 100000
      max_wall_clock_seconds: 600
      max_tool_calls: 60
      max_cost_usd: 2.50
