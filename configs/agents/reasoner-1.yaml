# Vendor binding for reasoner-1 (discovery).
#
# Which adapter and model run this stage, at what effort and under what
# bounds. Kept out of the protocol (docs/system-design.md section 4.2) so the
# same frozen cohort can run through a different vendor without minting a new
# protocol version.
#
# NOT YET RUNNABLE: no adapter container image has been built, so a run with
# this agent set will fail at adapter construction. Use -agents
# fixtures/agents for a smoke test.
adapter: claude
model: claude-opus-5
reasoning_level: high

# How each bound is actually enforced (verified against `claude --help` and
# `codex exec --help` - neither CLI has a timeout or token flag):
#
#   max_wall_clock_seconds  PREVENTION. The orchestrator wraps each attempt
#                           in a context deadline. Works on every adapter.
#   max_cost_usd            PREVENTION on claude (--max-budget-usd).
#                           `codex exec` has no budget flag, so a codex stage
#                           cannot be cost-bounded before the fact - only
#                           detected after, and only if it reports usage.
#   max_input_tokens        DETECTION only. No flag on either CLI, so these
#   max_output_tokens       are checked against the usage a stage reports and
#   max_tool_calls          fail it if exceeded. The spend has already
#                           happened; the check keeps the declared limit
#                           meaningful rather than reporting an over-budget
#                           run clean. An adapter that reports no usage
#                           (codex today) makes these uncheckable, and the
#                           run warns rather than passing silently.
budget:
  # Discovery reads the diff plus surrounding code, and is asked for recall,
  # so it gets the widest tool-call allowance of the three.
  max_input_tokens: 120000
  max_output_tokens: 8000
  max_wall_clock_seconds: 900
  max_tool_calls: 60
  max_cost_usd: 2.00
