# Fixture vendor binding for reasoner-3.
#
# Smoke-tests a cohort protocol end to end with no credentials, no network
# and no cost. Pair with -agents fixtures/agents; the protocol itself is
# unchanged, which is the point of separating the two.
adapter: fixture
model: fixture-model
reasoning_level: standard
budget:
  max_input_tokens: 16000
  max_output_tokens: 2000
  max_wall_clock_seconds: 300
  max_tool_calls: 20
  max_cost_usd: 0.50
